name: Attest release assets

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attest (for example, 1.4.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release source
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build release assets
        run: npm run build

      - name: Verify release version matches the tag
        run: test "$(node -p "require('./manifest.json').version")" = "$RELEASE_TAG"

      - name: Record the checked out release source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release source predicate
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node -e 'require("fs").writeFileSync("release-source.json", JSON.stringify({repository: process.env.SOURCE_REPOSITORY, ref: process.env.SOURCE_REF, commit: process.env.SOURCE_COMMIT, buildRun: process.env.BUILD_RUN}, null, 2))'

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Attest the checked out release source
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
          predicate-type: https://github.com/Ryeom/obsidian-dynamic-lock/attestation/release-source/v1
          predicate-path: release-source.json

      - name: Upload attested release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber
